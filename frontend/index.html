<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Titulo">
        <h1>Calculadora</h1>
    </div>
    <main>
        <div class="historico_css">
            <h2>Historico</h2>
            <p id="historico"></p>
        </div>
        <div class="bloco_claculadora">
            <div class="resultado_css">
                <p id="estrutura_A"></p>
                <p id="estrutura_operador"></p>
                <p id="estrutura_B"></p>
                <p id="resultado">0</p>
            </div>
            <div class="botoes_css">
                <button id="limpar">AC</button>
                <button id="apagar">⌫</button>
                <button id="porcentagem" class="operadores">%</button>
                <button id="divisao" class="operadores">÷</button>
                <button id="multipicacao" class="operadores">X</button>
                <button id="subtracao" class="operadores">-</button>
                <button id="soma" class="operadores">+</button>
                <button id="igual">=</button>

            <div class="numeros_css">
                <button id="number1" class="numero">1</button>
                <button id="number2" class="numero">2</button>
                <button id="number3" class="numero">3</button>
                <button id="number4" class="numero">4</button>
                <button id="number5" class="numero">5</button>
                <button id="number6" class="numero">6</button>
                <button id="number7" class="numero">7</button>
                <button id="number8" class="numero">8</button>
                <button id="number9" class="numero">9</button>
                <button id="number0" class="numero">0</button>

            </div>
            </div>

        </div>
    </main>
    
    <script type="module" src="main.js"></script>
</body>
</html>
